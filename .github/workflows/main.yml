name: Sincronizar Portal Corporativo

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: # Permite acionamento manual

permissions:
  contents: write # Garante que o GitHub Actions tem permissão para fazer o push

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v3
        # Removemos o 'ref: automacao-nuvem' para ele usar a branch padrão

      - name: Puxar arquivo de dados
        run: curl -L "https://drive.google.com/uc?export=download&id=1LWmsjkF22MP7aPUEUEVlx4gmnhniGCre" -o dados.json

      - name: Commit e Push para o GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add dados.json
          git commit -m "Automação: Atualizando dados.json do Google Drive" || exit 0
          git push
